<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>BSM — CMS</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="./static-cms-app.js"></script>
    <script>
      window.CMS.init({
        config: {
          backend: {
            name: "github",
            repo: "gsmandiriweb/site",
            branch: "main",
            auth: { client_id: "Ov23liVh1kY1hx8YykqC" },
          },
          local_backend: true,
          media_folder: "public/images/blog",
          public_folder: "/images/blog",
          publish_mode: "simple",
          collections: [
            {
              name: "blog",
              label: "Blog",
              label_singular: "Artikel",
              folder: "src/content/blog",
              create: true,
              slug: "{{slug}}",
              fields: [
                { name: "title", label: "Judul", widget: "string" },
                { name: "kicker", label: "Kicker", widget: "string", required: false },
                { name: "date", label: "Tanggal", widget: "datetime" },
                { name: "image", label: "Gambar", widget: "image", required: false },
                { name: "excerpt", label: "Ringkasan", widget: "text", required: false },
                {
                  name: "draft",
                  label: "Draft",
                  widget: "boolean",
                  required: false,
                  default: false,
                },
                { name: "body", label: "Isi Artikel", widget: "markdown" },
              ],
            },
          ],
        },
      });
    </script>
  </body>
</html>
