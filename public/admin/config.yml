# Decap CMS configuration for CV Bangun Sarana Makmur
# Host: GitHub Pages. Backend: GitHub (content committed as markdown into the repo's
# src/content/blog folder — nothing leaves the git repo).
#
# One-time setup:
#   1. Create a GitHub OAuth App (Settings → Developer settings → OAuth Apps).
#      - Homepage URL: https://gsmandiriweb.github.io/site/
#      - Authorization callback URL: https://gsmandiriweb.github.io/site/admin/
#   2. Put its Client ID in auth.client_id below.
#   3. Enable Pages → Build & deploy → Source: "GitHub Actions".
# `local_backend: true` lets you edit locally via `npx decap-server` (no OAuth needed).
backend:
  name: github
  repo: gsmandiriweb/site
  branch: main
  auth:
    client_id: Ov23liVh1kY1hx8YykqC
local_backend: true
media_folder: "public/images/blog"
public_folder: "/images/blog"
publish_mode: simple
collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Artikel"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Judul", widget: string }
      - { name: kicker, label: "Kicker", widget: string, required: false }
      - { name: date, label: "Tanggal", widget: datetime }
      - { name: image, label: "Gambar", widget: image, required: false }
      - { name: excerpt, label: "Ringkasan", widget: text, required: false }
      - { name: draft, label: "Draft", widget: boolean, required: false, default: false }
      - { name: body, label: "Isi Artikel", widget: markdown }
