# Cloudflare Workers + Assets configuration for the BSM site.
#
# Deploys go through `cf` (the Cloudflare CLI) via `cloudflare.config.ts`:
#   `npx cf build` then `npx cf deploy --prebuilt --mode production`
# (see .github/workflows/deploy.yml). `cf` ignores this file entirely.
#
# This file is KEPT only for the Wrangler commands `cf` cannot do yet:
#   `wrangler secret put <NAME> --name site` and `wrangler tail site`.
#
# IMPORTANT: do NOT set `main`/`assets` here.

name = "site"
compatibility_date = "2026-04-15"

# Node.js compatibility is REQUIRED for Astro on Cloudflare Workers. Astro's
# server runtime uses Node globals (Buffer, process, etc.) that workerd only
# exposes when this flag is set; without it every request 500s with
# "Buffer is not defined".
compatibility_flags = ["nodejs_compat"]

# Bindings injected by @astrojs/cloudflare for on-demand rendering
# (CMS sessions). The SESSION KV MUST exist or `cf deploy` fails.
# Create it once and paste its id here AND in cloudflare.config.ts:
#
#   npx wrangler kv namespace create SESSION
kv_namespaces = [{ binding = "SESSION", id = "21a01da3e6264da0a9f7e7dc42c1e874" }]

# CMS secrets. Set each at runtime with:
#   wrangler secret put CMS_OWNER_USERNAME     (owner username for /admin/login)
#   wrangler secret put CMS_OWNER_PASSWORD     (owner password for /admin/login)
#   (legacy: wrangler secret put CMS_OWNER_SECRET — old single-key login, still
#    honored until CMS_OWNER_USERNAME/PASSWORD are set)
#   wrangler secret put CMS_GITHUB_PAT         (GitHub PAT with repo scope, for
#                                               revision-branch/PR mutations)
#   wrangler secret put CMS_DEPLOY_CALLBACK_URL     (POST target for the deploy
#                                                   callback from GitHub Actions)
#   wrangler secret put CMS_DEPLOY_CALLBACK_SECRET  (HMAC key for the callback)
# The deploy workflow runs on every push to main and POSTs the deployed commit
# SHA to the callback, which records it in SESSION KV as the "live" commit.
# The GitHub App installation identity (ADR 0008) will replace the PAT for
# repository mutations as the next hardening step.

# Optional: Cloudflare Images binding. The adapter declares this because it can
# serve images via Cloudflare Images. This site serves images from the repo, so
# it is left disabled. Uncomment + create the binding only if you switch to
# Cloudflare Images.
# [images]
# binding = "IMAGES"
