# Cloudflare Workers + Assets configuration for the BSM site.
#
# Deploy flow:  `astro build`  (writes dist/client + dist/server, and a
#               generated dist/server/wrangler.json that wires the built server
#               entry + static assets together with the bindings below)
#                then  `wrangler deploy`  (reads dist/server/wrangler.json)
#
# IMPORTANT: do NOT set `main`/`assets` here. @astrojs/cloudflare supplies them
# from the build output. Setting them manually makes `astro build` fail, because
# the entry does not exist yet when the adapter validates this config at the
# start of the build.
#
# Use Workers + Assets (not classic Cloudflare *Pages*): the Astro 7 adapter
# emits a split output (static assets in dist/client, worker in dist/server).

name = "second-shepherd"
compatibility_date = "2026-04-15"

# Node.js compatibility is REQUIRED for Astro on Cloudflare Workers. Astro's
# server runtime uses Node globals (Buffer, process, etc.) that workerd only
# exposes when this flag is set; without it every request 500s with
# "Buffer is not defined".
compatibility_flags = ["nodejs_compat"]

# Bindings injected by @astrojs/cloudflare for on-demand rendering
# (Keystatic admin auth, Astro sessions). The SESSION KV MUST exist or
# `wrangler deploy` fails. Create it once and paste its id:
#
#   npx wrangler kv namespace create SESSION
kv_namespaces = [{ binding = "SESSION", id = "21a01da3e6264da0a9f7e7dc42c1e874" }]

# Optional: Cloudflare Images binding. The adapter declares this because it can
# serve images via Cloudflare Images. This site serves images from the repo, so
# it is left disabled. Uncomment + create the binding only if you switch to
# Cloudflare Images.
# [images]
# binding = "IMAGES"
